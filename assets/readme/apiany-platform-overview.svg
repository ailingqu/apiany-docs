<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">APIAny.AI platform overview</title>
  <desc id="desc">A product overview showing one API key connected to chat, image, video, task history, credits, and dashboard usage records.</desc>
  <defs>
    <linearGradient id="hero" x1="80" y1="64" x2="1120" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#174CFF"/>
      <stop offset="0.45" stop-color="#16B8C7"/>
      <stop offset="1" stop-color="#9B5CFF"/>
    </linearGradient>
    <linearGradient id="card" x1="92" y1="116" x2="1070" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#F7FAFF" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="shadow" x="45" y="35" width="1110" height="560" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#0B1533" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="620" rx="36" fill="#F5F8FF"/>
  <rect x="54" y="46" width="1092" height="528" rx="34" fill="url(#hero)"/>
  <g filter="url(#shadow)">
    <rect x="96" y="92" width="1008" height="436" rx="28" fill="url(#card)" stroke="#DCE4F2"/>
  </g>
  <g>
    <rect x="138" y="132" width="268" height="120" rx="24" fill="#0C1222"/>
    <text x="166" y="178" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">APIAny.AI</text>
    <text x="166" y="214" fill="#B9C5D8" font-family="Inter, Arial, sans-serif" font-size="18">One key. Stable endpoints.</text>
  </g>
  <g stroke="#CBD7EA" stroke-width="3" stroke-linecap="round">
    <path d="M420 192 H520"/>
    <path d="M520 192 C560 192 560 126 604 126 H782"/>
    <path d="M520 192 C560 192 560 192 604 192 H782"/>
    <path d="M520 192 C560 192 560 258 604 258 H782"/>
  </g>
  <g>
    <rect x="620" y="92" width="206" height="68" rx="18" fill="#EEF5FF" stroke="#D8E3F5"/>
    <circle cx="652" cy="126" r="16" fill="#174CFF"/>
    <text x="680" y="132" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Chat APIs</text>
  </g>
  <g>
    <rect x="620" y="158" width="206" height="68" rx="18" fill="#ECFDF5" stroke="#CBEBDD"/>
    <circle cx="652" cy="192" r="16" fill="#10B981"/>
    <text x="680" y="198" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Image APIs</text>
  </g>
  <g>
    <rect x="620" y="224" width="206" height="68" rx="18" fill="#FFF7ED" stroke="#FFE0BA"/>
    <circle cx="652" cy="258" r="16" fill="#F97316"/>
    <text x="680" y="264" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Video APIs</text>
  </g>
  <g>
    <rect x="138" y="294" width="266" height="180" rx="24" fill="#F8FAFC" stroke="#DCE4F2"/>
    <text x="166" y="336" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="4">REQUEST</text>
    <text x="166" y="374" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">Bearer API key</text>
    <text x="166" y="410" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="18">model: public model ID</text>
    <text x="166" y="442" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="18">prompt / messages / files</text>
  </g>
  <g>
    <rect x="864" y="132" width="196" height="342" rx="24" fill="#F8FAFC" stroke="#DCE4F2"/>
    <text x="892" y="176" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="4">PLATFORM</text>
    <text x="892" y="218" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">Standardized</text>
    <text x="892" y="248" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">responses</text>
    <rect x="892" y="286" width="134" height="38" rx="19" fill="#EAF1FF"/>
    <text x="912" y="311" fill="#174CFF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Task history</text>
    <rect x="892" y="338" width="134" height="38" rx="19" fill="#E8FFF5"/>
    <text x="912" y="363" fill="#059669" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Usage records</text>
    <rect x="892" y="390" width="134" height="38" rx="19" fill="#FFF3E4"/>
    <text x="912" y="415" fill="#EA580C" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Credits</text>
  </g>
  <g>
    <text x="138" y="562" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Build AI product workflows with one documented API surface.</text>
  </g>
</svg>
