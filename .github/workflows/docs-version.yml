name: Update docs version marker

# Recomputes snippets/docs-version.mdx (date + content fingerprint) on every push
# to main, so the marker stays correct even for commits that bypass the local
# pre-commit hook — e.g. edits made in the Mintlify web editor ("Updated mintlify
# pages"). Pushes made with GITHUB_TOKEN do not retrigger workflows, so the commit
# below cannot loop.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: docs-version-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-marker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update version marker
        run: node scripts/update-docs-version.mjs

      - name: Commit if the marker changed
        run: |
          if git diff --quiet -- snippets/docs-version.mdx; then
            echo "Version marker already current — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snippets/docs-version.mdx
          git commit -m "chore: update docs version marker [skip ci]"
          git push
